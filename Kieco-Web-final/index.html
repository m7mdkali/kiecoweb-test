<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kieco Exchange | Send money and exchange currency</title>
  <meta name="description" content="Kieco Exchange: send money and exchange currency.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://flagcdn.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11.1.4/swiper-bundle.min.css">
  <script>(function(){var h=document.documentElement;h.classList.add("js");var seen=false;try{seen=sessionStorage.getItem("kiecoIntroSeen")==="1";}catch(e){}if(!seen&&!window.matchMedia("(prefers-reduced-motion: reduce)").matches){h.classList.add("intro-on");}})();</script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Opening animation: a deep navy screen. The gold logo rises out of a soft blur, the words settle, then the curtain opens. js/main.js removes it after about 3.8 seconds. -->
  <div class="intro" id="intro">
    <span class="intro-panel intro-top" aria-hidden="true"></span>
    <span class="intro-panel intro-bottom" aria-hidden="true"></span>
    <div class="intro-content">
      <span class="intro-glow" aria-hidden="true"></span>
      <span class="intro-frame" aria-hidden="true"></span>
      <img class="intro-logo" id="intro-logo" src="images/kieco-logo-gold.png" alt="Kieco Exchange" width="246" height="305">
      <span class="intro-rule" aria-hidden="true"></span>
      <div class="intro-text">
        <p class="intro-words" data-text="introWords"></p>
        <p class="intro-place" data-text="introPlace"></p>
      </div>
    </div>
  </div>

  <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>
  <a class="skip-link" href="#main" data-text="skipLink"></a>

  <!-- ===== TOP BAR: call, email and WhatsApp ===== -->
  <div class="top-bar" id="top">
    <div class="tb-links">
      <a class="tb-link" data-href="tel" dir="ltr" aria-label="Call">
        <span class="tb-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></span>
        <span class="tb-text"><b data-text="topCall"></b> <span data-text="phone"></span></span>
      </a>
      <a class="tb-link" data-href="mail" dir="ltr" aria-label="Email">
        <span class="tb-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg></span>
        <span class="tb-text" data-text="email"></span>
      </a>
      <a class="tb-link tb-whatsapp" data-href="whatsapp" target="_blank" rel="noopener" aria-label="WhatsApp">
        <span class="tb-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg></span>
        <span class="tb-text" data-text="whatsappLabel"></span>
      </a>
    </div>
    <button class="lang-btn" type="button" data-text="langButton"></button>
  </div>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <a class="logo" href="#top" aria-label="Kieco Exchange"></a>
    <div class="site-search" id="site-search">
      <label class="search">
        <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="site-q" data-placeholder="searchPlaceholder" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="site-results" aria-autocomplete="list">
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
        <button class="search-clear" id="site-clear" type="button" hidden>&times;</button>
      </label>
      <ul class="site-results" id="site-results" role="listbox" hidden></ul>
    </div>
    <button class="search-toggle" id="search-toggle" type="button" aria-expanded="false" aria-controls="site-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <nav class="main-nav" aria-label="Main menu">
      <ul id="nav-list"></ul>
    </nav>
    <a class="btn btn-primary btn-small btn-motion" data-href="register" data-text="sendMoney"></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-label="Menu">&#9776;</button>
  </header>

  <main id="main">

    <!-- ===== 1. HERO SLIDER ===== -->
    <section id="home" class="hero">
      <div class="swiper hero-slider">
        <div class="swiper-wrapper" id="hero-slides"></div>
        <div class="swiper-pagination"></div>
      </div>
    </section>

    <!-- ===== 2. CHECK THE EXCHANGE RATE ===== -->
    <section id="rates" class="rate-check">
      <div class="rate-box">
        <h2 data-text="rateTitle"></h2>
        <p class="section-intro" data-text="rateIntro"></p>
        <div class="rate-toolbar">
          <div class="tabs">
            <button class="tab active" type="button" data-text="tabTransfer"></button>
            <button class="tab" type="button" data-text="tabFx"></button>
          </div>
          <div class="rate-search">
            <input type="search" id="rate-search" data-placeholder="rateSearchPlaceholder" aria-label="Search" autocomplete="off">
            <ul class="rate-dropdown" id="rate-dropdown" hidden></ul>
          </div>
        </div>

        <!-- Money transfer: the calculator is always here; the receiving country is picked from the list -->
        <div id="transfer-pane">
          <div class="calc" id="calc">
            <div class="calc-fields">
              <div class="fx-field calc-send">
                <span class="calc-label" data-text="calcSend"></span>
                <span class="fx-input-wrap">
                  <input type="number" id="calc-send" min="0" step="any" value="100" inputmode="decimal">
                  <span class="fx-flag" id="calc-send-flag"></span>
                  <b id="calc-send-unit"></b>
                </span>
              </div>
              <div class="fx-dd dest-dd" id="dest-dd">
                <div class="fx-field calc-receive-field">
                  <span class="calc-label" data-text="calcReceive"></span>
                  <span class="calc-out"><b id="calc-receive">0.00</b></span>
                  <button class="dest-trigger" id="dest-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="dest-menu">
                    <span class="fx-flag" id="dest-flag"></span>
                    <b id="dest-code"></b>
                  </button>
                  <span class="fx-chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
                </div>
                <ul class="fx-menu" id="dest-menu" role="listbox" hidden></ul>
              </div>
            </div>
            <div class="calc-result">
              <div class="calc-result-top">
                <div>
                  <div class="calc-flow" aria-hidden="true">
                    <span class="calc-flag" id="calc-flow-from"></span>
                    <svg class="calc-flow-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13"/><path d="m14 4 4 4-4 4"/><path d="M20 16H7"/><path d="m10 12-4 4 4 4"/></svg>
                    <span class="calc-flag" id="calc-flow-to"></span>
                  </div>
                  <span class="calc-label calc-label-light" data-text="calcRate"></span>
                  <strong class="calc-rate" id="calc-rate"></strong>
                </div>
                <span class="calc-best" id="calc-best" data-text="calcBest" hidden></span>
              </div>
              <div class="calc-meta">
                <span><span data-text="calcDelivery"></span>: <b id="calc-delivery"></b></span>
                <span><span data-text="calcCommission"></span>: <b id="calc-commission"></b></span>
              </div>
              <p class="calc-note" data-text="calcNote"></p>
            </div>
            <div class="calc-actions">
              <a class="btn btn-ghost" href="#faqs" data-text="btnFaqs"></a>
              <a class="btn btn-primary" data-href="register" data-text="btnRemit"></a>
            </div>
          </div>
        </div>

        <!-- Foreign currency: the rate table -->
        <div id="fx-pane" hidden>
          <div class="fx-head">
            <span class="fx-live"><i aria-hidden="true"></i><span data-text="fxLive"></span></span>
            <span class="fx-title" data-text="fxTitle"></span>
          </div>
          <div class="fx-card">
            <div class="fx-dd" id="fx-dd">
              <div class="fx-field">
                <span class="calc-label" id="fx-currency-label" data-text="fxCurrency"></span>
                <button class="fx-trigger" id="fx-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="fx-menu" aria-labelledby="fx-currency-label">
                  <span class="fx-flag" id="fx-flag"></span>
                  <span class="fx-trigger-name" id="fx-name"></span>
                </button>
                <span class="fx-chev" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></span>
              </div>
              <ul class="fx-menu" id="fx-menu" role="listbox" aria-labelledby="fx-currency-label" hidden></ul>
              <select id="fx-select" hidden tabindex="-1" aria-hidden="true"></select>
            </div>
            <label class="fx-field">
              <span class="calc-label" data-text="fxAmount"></span>
              <span class="fx-input-wrap">
                <input type="number" id="fx-amount" min="0" step="any" value="1000" inputmode="decimal">
                <b id="fx-code"></b>
              </span>
            </label>
          </div>
          <div class="fx-results">
            <div class="fx-result is-buy"><span class="fx-result-label" data-text="fxBuy"></span><strong id="fx-buy"></strong></div>
            <div class="fx-result is-sell"><span class="fx-result-label" data-text="fxSell"></span><strong id="fx-sell"></strong></div>
          </div>
          <div class="calc-actions fx-actions">
            <a class="btn btn-ghost" href="#branches" data-text="fxBranch"></a>
            <a class="btn btn-primary" data-href="register" data-text="fxOrder"></a>
          </div>
        </div>

        <div class="rate-foot">
          <p class="rate-source" data-text="rateSource"></p>
        </div>
      </div>
    </section>

    <!-- ===== 3. CURRENCY TICKER ===== -->
    <section class="ticker-section" aria-label="Currency ticker">
      <div class="ticker">
        <div class="ticker-track" id="ticker-track"></div>
      </div>
      <div class="ticker-nav">
        <button class="ticker-btn" id="ticker-prev" type="button" aria-label="Previous">&lsaquo;</button>
        <button class="ticker-btn" id="ticker-next" type="button" aria-label="Next">&rsaquo;</button>
      </div>
    </section>

    <!-- ===== 3b. OUR STORY: a clock-style frame that keeps turning, and the "Why choose KIECO" button ===== -->
    <section class="story" id="story">
      <div class="story-inner">
        <div class="story-clock" aria-hidden="true">
          <span class="clock-frame"></span>
          <span class="clock-ring"></span>
          <span class="clock-hand"></span>
          <span class="clock-center">
            <span class="clock-kicker" data-text="storyKicker"></span>
            <span class="clock-year" data-text="founded"></span>
            <span class="clock-tag" data-text="storyTag"></span>
          </span>
        </div>
        <div class="story-text">
          <p class="story-eyebrow" data-text="storyEyebrow"></p>
          <h2 data-text="storyTitle"></h2>
          <p class="story-body" data-text="storyText"></p>
          <div class="story-actions">
            <button class="story-link" id="story-discover" type="button" data-text="storyDiscover"></button>
            <button class="btn btn-primary" id="why-open" type="button" aria-expanded="false" aria-controls="why">
              <span class="why-open-text" data-text="whyOpenText"></span>
              <span class="why-close-text" data-text="helpCloseText"></span>
              <span class="help-chev" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- ===== 3c. WHY CHOOSE KIECO (opens when the button in the story is pressed) ===== -->
    <!-- Numbers: digits roll into place, then settle -->
    <section class="pulse-stats" id="stats" aria-labelledby="stats-title">
      <div class="ps-inner">
        <div class="ps-intro">
          <div class="ps-logo-wrap">
            <div class="logo-flip ps-logo">
              <img class="footer-logo" src="images/kieco-logo-gold.png" alt="Kieco Exchange" width="246" height="305">
              <img class="footer-logo footer-logo-back" src="images/kieco-logo-gold.png" alt="" aria-hidden="true" width="246" height="305">
            </div>
          </div>
          <p class="ps-eyebrow" data-text="statsEyebrow"></p>
          <h2 class="ps-title" id="stats-title"><span data-text="statsTitleA"></span> <em data-text="statsTitleB"></em></h2>
          <p class="ps-text" data-text="statsText"></p>
        </div>
        <div class="ps-grid">
          <div class="ps-tile" style="--d:0">
            <div class="ps-card">
              <span class="ps-num" data-value="1979"></span>
              <span class="ps-label" data-text="stat1Label"></span>
              <span class="ps-bar" aria-hidden="true"></span>
            </div>
          </div>
          <a class="ps-tile is-link" href="#rates" style="--d:1">
            <span class="ps-card">
              <span class="ps-dot" aria-hidden="true"></span>
              <span class="ps-num" data-value="11"></span>
              <span class="ps-label" data-text="stat2Label"></span>
              <span class="ps-go"><span data-text="statsGoRates"></span><svg class="ps-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
              <span class="ps-bar" aria-hidden="true"></span>
            </span>
          </a>
          <div class="ps-tile" style="--d:2">
            <div class="ps-card">
              <span class="ps-num" data-value="56"></span>
              <span class="ps-label" data-text="stat3Label"></span>
              <span class="ps-bar" aria-hidden="true"></span>
            </div>
          </div>
          <div class="ps-tile" style="--d:3">
            <div class="ps-card">
              <span class="ps-num" data-value="4"></span>
              <span class="ps-label" data-text="stat4Label"></span>
              <span class="ps-bar" aria-hidden="true"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="why" class="why" aria-labelledby="why-title" hidden>
      <div class="why-inner">
        <header class="why-head">
          <p class="why-eyebrow why-rise" style="--d:0.05s" data-text="whyEyebrow"></p>
          <h2 id="why-title" class="why-rise" style="--d:0.12s" data-text="whyTitle"></h2>
          <p class="section-intro why-rise" style="--d:0.2s" data-text="whyIntro"></p>
        </header>

        <div class="why-acc why-rise" style="--d:0.3s">
          <div class="why-item is-open">
            <h3 class="why-h">
              <button class="why-trigger" type="button" id="why-t1" aria-expanded="true" aria-controls="why-p1">
                <span class="why-no">01</span>
                <span class="why-name" data-text="why1Title"></span>
                <span class="why-plus" aria-hidden="true"></span>
              </button>
            </h3>
            <div class="why-body" id="why-p1" role="region" aria-labelledby="why-t1">
              <div class="why-body-in">
                <div class="why-art art-photo" aria-hidden="true"><img src="images/why-personal-support.jpg" alt="" loading="lazy" width="1400" height="782"></div>
                <p data-text="why1Text"></p>
              </div>
            </div>
          </div>
          <div class="why-item">
            <h3 class="why-h">
              <button class="why-trigger" type="button" id="why-t2" aria-expanded="false" aria-controls="why-p2">
                <span class="why-no">02</span>
                <span class="why-name" data-text="why2Title"></span>
                <span class="why-plus" aria-hidden="true"></span>
              </button>
            </h3>
            <div class="why-body" id="why-p2" role="region" aria-labelledby="why-t2">
              <div class="why-body-in">
                <div class="why-art art-dhow" aria-hidden="true"><svg viewBox="0 0 240 160"><use href="#kw-dhow"/></svg></div>
                <p data-text="why2Text"></p>
              </div>
            </div>
          </div>
          <div class="why-item">
            <h3 class="why-h">
              <button class="why-trigger" type="button" id="why-t3" aria-expanded="false" aria-controls="why-p3">
                <span class="why-no">03</span>
                <span class="why-name" data-text="why3Title"></span>
                <span class="why-plus" aria-hidden="true"></span>
              </button>
            </h3>
            <div class="why-body" id="why-p3" role="region" aria-labelledby="why-t3">
              <div class="why-body-in">
                <div class="why-art art-map" aria-hidden="true"><div class="map-stage"><img src="images/transfer-map-base.jpg" alt="" loading="lazy" width="1400" height="782"><div class="map-chips" id="map-chips"></div></div></div>
                <p data-text="why3Text"></p>
              </div>
            </div>
          </div>
          <div class="why-item">
            <h3 class="why-h">
              <button class="why-trigger" type="button" id="why-t4" aria-expanded="false" aria-controls="why-p4">
                <span class="why-no">04</span>
                <span class="why-name" data-text="why4Title"></span>
                <span class="why-plus" aria-hidden="true"></span>
              </button>
            </h3>
            <div class="why-body" id="why-p4" role="region" aria-labelledby="why-t4">
              <div class="why-body-in">
                <div class="why-art art-photo art-regulated" aria-hidden="true"><img src="images/why-regulated.jpg" alt="" loading="lazy" width="1400" height="782"></div>
                <p data-text="why4Text"></p>
              </div>
            </div>
          </div>
        </div>

        <article class="kw" id="kuwait">
          <div class="kw-art" aria-hidden="true">
            <span class="kw-sun"></span>
            <svg class="kw-towers" viewBox="0 0 200 300"><use href="#kw-towers"/></svg>
            <svg class="kw-dhow" viewBox="0 0 240 160"><use href="#kw-dhow"/></svg>
            <span class="kw-sea"></span>
          </div>
          <div class="kw-text">
            <p class="kw-eyebrow" data-text="kwEyebrow"></p>
            <h3 class="kw-title" data-text="kwTitle"></h3>
            <p class="kw-body" data-text="kwText"></p>
            <div class="kw-stats">
              <div><strong class="kw-num" id="stat-branches"></strong><span data-text="kwStatBranches"></span></div>
              <div><strong class="kw-num" id="stat-rates"></strong><span data-text="kwStatDest"></span></div>
              <div><strong class="kw-num" id="stat-curr"></strong><span data-text="kwStatCurr"></span></div>
            </div>
            <a class="btn btn-gold" href="#branches" data-text="kwLocations"></a>
          </div>
        </article>
      </div>
    </section>

    <!-- ===== 4. KIECO EXCHANGE EXPERIENCE ===== -->
    <section id="services" class="experience">
      <h2 data-text="expTitle"></h2>
      <p class="section-intro" data-text="expIntro"></p>
      <div class="exp-grid" id="exp-grid"></div>
      <div class="center">
        <button class="btn btn-help" id="help-open" type="button" aria-expanded="false" aria-controls="help">
          <span class="help-open-text" data-text="helpOpenText"></span>
          <span class="help-close-text" data-text="helpCloseText"></span>
          <span class="help-chev" aria-hidden="true"></span>
        </button>
      </div>
    </section>

    <!-- ===== 4b. LET US HELP YOU CHOOSE (opens when the button above is pressed) ===== -->
    <section id="help" class="help" aria-labelledby="help-title" hidden>
      <div class="help-inner">
        <header class="help-head">
          <p class="help-eyebrow help-rise" style="--d:0.05s" data-text="helpEyebrow"></p>
          <h2 id="help-title" class="help-rise" style="--d:0.12s" data-text="helpTitle"></h2>
          <div class="help-call help-rise" style="--d:0.3s">
            <a class="btn btn-gold help-call-btn" data-href="tel" data-text="helpCallTeam"></a>
          </div>
        </header>

        <h3 class="help-choose help-rise" style="--d:0.4s" data-text="helpChooseTitle"></h3>

        <div class="help-cards">
          <div class="help-item help-rise" style="--d:0.5s">
            <article class="help-card">
              <span class="help-no" aria-hidden="true">01</span>
              <span class="help-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span>
              <p class="help-label" data-text="helpCallLabel"></p>
              <h3 data-text="helpCallTitle"></h3>
              <p class="help-text" data-text="helpCallText"></p>
              <a class="help-link" data-href="tel" dir="ltr"><span data-text="phone"></span></a>
            </article>
          </div>
          <div class="help-item help-rise" style="--d:0.62s">
            <article class="help-card">
              <span class="help-no" aria-hidden="true">02</span>
              <span class="help-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>
              <p class="help-label" data-text="helpWriteLabel"></p>
              <h3 data-text="helpWriteTitle"></h3>
              <p class="help-text" data-text="helpWriteText"></p>
              <a class="help-link" href="#contact"><span data-text="helpWriteLink"></span><svg class="help-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
            </article>
          </div>
          <div class="help-item help-rise" style="--d:0.74s">
            <article class="help-card">
